name: seeable
description: "Seeable - Mobile application for blind"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  firebase_core: ^3.6.0
  google_fonts: ^6.2.1
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.3.5
  package_info_plus: ^8.1.1
  flutter_secure_storage: ^9.2.2
  permission_handler: ^12.0.1
  flutter_localization: ^0.3.3
  flutter_svg: ^2.0.16
  flutter_tts: ^4.2.2
  flutter_compass: ^0.8.1
  image_picker: ^1.1.2
  image: ^4.5.3
  camera: ^0.11.1
  speech_to_text: ^7.0.0
  connectivity_plus: ^6.1.3
  dio: ^5.8.0+1
  android_id: ^0.4.0
  device_info_plus: ^11.2.1
  intl: ^0.20.2
  translator: ^1.0.3+1
  photo_manager: ^3.7.0
  dotted_line: ^3.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#FFFFFF"  # Add adaptive icon settings for Android 8+
  adaptive_icon_foreground: "assets/logo/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/logo/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/logo/logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/logo/logo.png"

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logo/
    - assets/intro/
    - assets/images/